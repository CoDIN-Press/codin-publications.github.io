name: Validate portal
on:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Validate source and metadata
        shell: pwsh
        run: ./scripts/validate.ps1
      - name: Render portal
        run: quarto render
      - uses: actions/upload-artifact@v4
        with:
          name: codin-press-preview
          path: _site
